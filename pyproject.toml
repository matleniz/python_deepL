[project]
name = "python-deepl"
version = "0.1.0"
description = "Python / DeepL — agents ml-arena (PettingZoo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mlarena-sdk==0.3.0",
    "numpy>=2.5.3",
    "pettingzoo>=1.24.0",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projet"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
